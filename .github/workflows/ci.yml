# Tests and production build on every push to main and on pull requests.
# Lighthouse runs alongside, as information only: the runners vary too much to gate on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Information only, and the light version only. The hosted runner has no GPU, so Chrome falls back
  # to software WebGL and the full desktop page - a two-million-triangle car - stops responding, and
  # Lighthouse gives up. Reproduced locally by disabling the GPU: the same page scores 70 there with
  # 31,554 ms of blocking time, against 100 and 0 ms for the light version, which never downloads
  # Three.js at all. Desktop belongs to a local run against a reference commit (README, "Making of"),
  # which is what decides anything here anyway.
  # continue-on-error keeps a slow runner from ever failing a pull request.
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "the preview server never answered" >&2
          exit 1

      - name: Measure the light version
        run: |
          npx --yes lighthouse@12 "http://localhost:4173/" --quiet \
            --output=json --output-path=lh-mobile.json \
            --chrome-flags="--headless=new --no-sandbox"
          {
            echo "| run | perf | a11y | best practices | seo | TBT | LCP | CLS | weight |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          node .github/lighthouse-summary.mjs lh-mobile.json mobile

      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lh-mobile.json
