# Tests and production build on every push to main and on pull requests.
# Lighthouse CI joins later (Bloco 6, day 3), as information only: the runners vary too much to gate on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
